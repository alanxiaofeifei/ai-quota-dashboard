name: Local prototype and offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - run: node --test scripts/source-manifest.test.mjs
      - run: node --test tests/usage-selection.test.mjs
      - run: python -m unittest discover -s scripts -p test_codex_unauthenticated_smoke.py
      - name: Windows command discovery diagnostics tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-cli-diagnostics.Tests.ps1
      - name: Verify mirrored core source when a backup manifest is present
        shell: bash
        run: |
          if [ -f core-backup.json ]; then
            node scripts/source-manifest.mjs --verify core-backup.json
          fi
      - run: cargo build --locked --release --bin ai-quota-preflight
      - run: cargo build --locked --release --bin ai-quota-dashboard
      - run: cargo run --locked --bin ai-quota-dashboard -- --version
      - run: cargo run --locked --bin ai-quota-preflight -- doctor
      - name: Collect third-party licenses and prepare portable packages
        shell: bash
        run: |
          cargo fetch --locked
          python scripts/package-notices.py --output dist/package-notices
          node scripts/source-manifest.mjs > dist/source-manifest.json
          python - <<'PY'
          import hashlib
          import pathlib
          import shutil
          import sys

          suffix = '.exe' if sys.platform == 'win32' else ''
          for name in ('ai-quota-preflight', 'ai-quota-dashboard'):
              destination = pathlib.Path('dist') / name
              shutil.copytree('dist/package-notices', destination)
              binary = pathlib.Path('target/release') / (name + suffix)
              shutil.copy2(binary, destination)
              shutil.copy2('dist/source-manifest.json', destination / 'SOURCE_MANIFEST.json')
              digest = hashlib.sha256(binary.read_bytes()).hexdigest()
              (destination / 'SHA256SUMS').write_text(f'{digest}  {binary.name}\n', encoding='utf-8')
          extension = pathlib.Path('dist/quota-usage-selection-validator')
          shutil.copytree('browser-extension', extension)
          shutil.copy2('LICENSE', extension / 'LICENSE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-quota-preflight-${{ runner.os }}
          path: dist/ai-quota-preflight/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: quota-usage-selection-validator
          path: dist/quota-usage-selection-validator/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ai-quota-dashboard-${{ runner.os }}
          path: dist/ai-quota-dashboard/
          if-no-files-found: error
