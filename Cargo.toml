[package]
name = "ai-quota-preflight"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local-only Phase 0 feasibility tools for AI subscription quota monitoring"
publish = false
default-run = "ai-quota-preflight"

[features]
default = []
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ai-quota-preflight"
path = "src/main.rs"

[[bin]]
name = "quota-mock-app-server"
path = "tests/support/mock_app_server.rs"
required-features = ["test-support"]
