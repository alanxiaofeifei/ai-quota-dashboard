[package]
name = "ai-quota-preflight"
version = "0.3.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Local AI subscription quota observations and feasibility tools"
publish = false
default-run = "ai-quota-preflight"

[features]
default = []
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "ai-quota-preflight"
path = "src/main.rs"

[[bin]]
name = "ai-quota-dashboard"
path = "src/dashboard_main.rs"

[[bin]]
name = "quota-mock-app-server"
path = "tests/support/mock_app_server.rs"
required-features = ["test-support"]
